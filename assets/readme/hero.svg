<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Tiny Icons — 小图标生成器</title>
  <desc id="desc">米白底编辑风标题：Tiny Icons，副标题 Make it tiny；右侧是深蓝 128px 主画布上的薄荷绿终端符号，旁边是 16/32/48/128 四档尺寸检查。</desc>

  <rect width="1200" height="360" rx="26" fill="#f6f1e7"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#655d4d">CHROME 扩展 + FAVICON 图标生成器</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#0f3d36">Tiny Icons</text>
    <text x="56" y="168" font-size="23" fill="#333333">Make it tiny. — 先看 16px，再看 128px</text>
    <text x="56" y="204" font-size="19" fill="#5a554a">46 个 Lucide 图标、模板与排版，一键导出图标包。</text>
    <g id="chips" font-size="18" fill="#1a1a1a" text-anchor="middle">
      <g><rect x="56" y="238" width="162" height="36" rx="18" fill="#ffffff" stroke="#d8d0bd" stroke-width="1.5"/><text x="137" y="262">46 个 Lucide 图标</text></g>
      <g><rect x="230" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8d0bd" stroke-width="1.5"/><text x="293" y="262">15 种布局</text></g>
      <g><rect x="368" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8d0bd" stroke-width="1.5"/><text x="431" y="262">4 种字体</text></g>
      <g><rect x="506" y="238" width="144" height="36" rx="18" fill="#0f3d36" stroke="#0f3d36" stroke-width="1.5"/><text x="578" y="262" fill="#f6f1e7">ZIP 一键导出</text></g>
    </g>
    <text x="56" y="318" font-size="18" fill="#655d4d">本地草稿 · 无需账号 · 全程离线生成</text>
  </g>

  <g id="canvas-scene" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="768" y="40" font-size="18" fill="#a63e1e">MASTER CANVAS / 128 PX</text>
    <g id="master-canvas">
      <rect x="768" y="56" width="220" height="220" rx="48" fill="#0a1f44"/>
      <rect x="768" y="56" width="220" height="220" rx="48" fill="none" stroke="#0a1f44" stroke-width="2"/>
    </g>
    <g id="terminal-glyph" stroke="#5eead4" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="828,132 872,166 828,200"/>
      <line x1="884" y1="200" x2="932" y2="200"/>
    </g>
    <g id="safe-area" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.55" fill="none">
      <rect x="800" y="88" width="156" height="156" rx="8"/>
    </g>
    <text x="878" y="302" font-size="18" fill="#655d4d" text-anchor="middle">SAFE AREA / 96 PX</text>
    <g id="size-check">
      <text x="1024" y="72" font-size="18" fill="#a63e1e">SIZE CHECK</text>
      <g id="size-icons">
        <rect x="1024" y="84" width="48" height="48" rx="10" fill="#0a1f44"/>
        <polyline points="1038,100 1048,108 1038,116" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="1024" y="144" width="36" height="36" rx="8" fill="#0a1f44"/>
        <polyline points="1035,156 1042,162 1035,168" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="1024" y="192" width="28" height="28" rx="6" fill="#0a1f44"/>
        <polyline points="1033,201 1039,206 1033,211" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="1024" y="232" width="20" height="20" rx="5" fill="#0a1f44"/>
        <polyline points="1030,238 1035,242 1030,246" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <rect x="1050" y="80" width="140" height="200" fill="#f6f1e7"/>
      <g id="size-labels">
        <text x="1084" y="105" font-size="18" fill="#333333">128 × 128</text>
        <text x="1084" y="126" font-size="16" fill="#2e7d32">● 清晰</text>
        <text x="1072" y="158" font-size="18" fill="#333333">48 × 48</text>
        <text x="1072" y="178" font-size="16" fill="#2e7d32">● 清晰</text>
        <text x="1064" y="205" font-size="18" fill="#333333">32 × 32</text>
        <text x="1064" y="225" font-size="16" fill="#2e7d32">● 清晰</text>
        <text x="1056" y="242" font-size="18" fill="#333333">16 × 16</text>
        <text x="1056" y="262" font-size="16" fill="#2e7d32">● 清晰</text>
      </g>
    </g>
  </g>
</svg>
